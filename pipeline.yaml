          \           {\"name\": \"S3_ENDPOINT\",           \"value\": s3_endpoint},\n\
          \                    {\"name\": \"S3_BUCKET\",             \"value\": s3_bucket},\n\
          \                    {\"name\": \"AWS_ACCESS_KEY_ID\",     \"value\": s3_key_id},\n\
          \                    {\"name\": \"AWS_SECRET_ACCESS_KEY\", \"value\": s3_secret},\n\
          \                    {\"name\": \"X_URI\",                 \"value\": x_uri},\n\
