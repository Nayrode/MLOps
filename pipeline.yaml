          failed\", 0)\n                print(f\"  [{elapsed:3d}s] active={active}\
          \ succeeded={succeeded} failed={failed}\")\n                if succeeded\
          \ >= 1:\n                    print(\"TrainJob termin\xE9 avec succ\xE8s.\"\
          )\n                    break\n                if failed >= 1:\n        \
