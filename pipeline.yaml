pipelineInfo:
  name: csgo-match-predictor
root:
  dag:
    tasks:
      deploy:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-deploy
        dependentTasks:
        - upload-model
        inputs:
          artifacts:
            model_uri:
              taskOutputArtifact:
                outputArtifactKey: model_uri
                producerTask: upload-model
          parameters:
            namespace:
              componentInputParameter: deploy_namespace
        taskInfo:
          name: deploy
      dvc-pull:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-dvc-pull
        taskInfo:
          name: dvc-pull
      evaluate:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-evaluate
        dependentTasks:
        - preprocessing
        - train
        inputs:
          artifacts:
            X_test:
              taskOutputArtifact:
                outputArtifactKey: X_test
                producerTask: preprocessing
            model:
              taskOutputArtifact:
                outputArtifactKey: model
                producerTask: train
            y_test:
              taskOutputArtifact:
                outputArtifactKey: y_test
                producerTask: preprocessing
        taskInfo:
          name: evaluate
      feature-engineering:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-feature-engineering
        dependentTasks:
        - dvc-pull
        inputs:
          artifacts:
            raw_data:
              taskOutputArtifact:
                outputArtifactKey: raw_data
                producerTask: dvc-pull
        taskInfo:
          name: feature-engineering
      monitoring:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-monitoring
        dependentTasks:
        - preprocessing
        - train
        inputs:
          artifacts:
            X_test:
              taskOutputArtifact:
                outputArtifactKey: X_test
                producerTask: preprocessing
            X_train:
              taskOutputArtifact:
                outputArtifactKey: X_train
                producerTask: preprocessing
            model:
              taskOutputArtifact:
                outputArtifactKey: model
                producerTask: train
            y_test:
              taskOutputArtifact:
                outputArtifactKey: y_test
                producerTask: preprocessing
          parameters:
            drift_threshold:
              componentInputParameter: drift_threshold
        taskInfo:
          name: monitoring
      preprocessing:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-preprocessing
        dependentTasks:
        - feature-engineering
        inputs:
          artifacts:
            featured_data:
              taskOutputArtifact:
                outputArtifactKey: featured_data
                producerTask: feature-engineering
          parameters:
            train_ratio:
              componentInputParameter: train_ratio
        taskInfo:
          name: preprocessing
      test-inference:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-test-inference
        dependentTasks:
        - deploy
        - preprocessing
        inputs:
          artifacts:
            X_test:
              taskOutputArtifact:
                outputArtifactKey: X_test
                producerTask: preprocessing
            inference_url:
              taskOutputArtifact:
                outputArtifactKey: inference_url
                producerTask: deploy
            y_test:
              taskOutputArtifact:
                outputArtifactKey: y_test
                producerTask: preprocessing
          parameters:
            n_samples:
              componentInputParameter: n_samples
        taskInfo:
          name: test-inference
