          ,\n    s3_bucket: str = \"mlpipeline\",\n):\n    import os\n    import time\n\
          \    import boto3\n    from kubernetes import client as k8s, config as k8s_config\n\
          \n    s3_key_id = os.environ.get(\"AWS_ACCESS_KEY_ID\", \"minio\")\n   \
