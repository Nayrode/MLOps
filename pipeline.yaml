          , \"_map\"]\n\n    df = pd.read_csv(featured_data.path, index_col=0, parse_dates=[\"\
          date\"])\n    df = df.sort_values(\"date\").reset_index(drop=True)\n   \
          \ split = int(len(df) * train_ratio)\n    train_df, test_df = df.iloc[:split],\
