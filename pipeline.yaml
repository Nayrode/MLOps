# PIPELINE DEFINITION
# Name: csgo-match-predictor
# Inputs:
#    model_type: str [Default: 'xgboost']
#    train_ratio: float [Default: 0.8]
components:
  comp-evaluate:
    executorLabel: exec-evaluate
  comp-feature-engineering:
    executorLabel: exec-feature-engineering
  comp-preprocessing:
    executorLabel: exec-preprocessing
    inputDefinitions:
      parameters:
        train_ratio:
          defaultValue: 0.8
          isOptional: true
          parameterType: NUMBER_DOUBLE
  comp-train:
    executorLabel: exec-train
    inputDefinitions:
      parameters:
        model_type:
          defaultValue: xgboost
          isOptional: true
          parameterType: STRING
deploymentSpec:
  executors:
    exec-evaluate:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - evaluate
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas==2.2.3'\
          \ 'scikit-learn==1.6.1' 'xgboost==3.2.0' 'joblib==1.5.0'  &&  python3 -m\
          \ pip install --quiet --no-warn-script-location 'kfp==2.16.1' '--no-deps'\
          \ 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"$0\" \"$@\"\
          \n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef evaluate():\n    import joblib\n    import pandas as pd\n   \
          \ from sklearn.metrics import accuracy_score, roc_auc_score\n    import\
          \ json\n\n    pipeline = joblib.load(f\"{DATA}/model.pkl\")\n    X = pd.read_csv(f\"\
          {DATA}/X_test.csv\",  index_col=0)\n    y = pd.read_csv(f\"{DATA}/y_test.csv\"\
          ,  index_col=0).squeeze()\n\n    acc = accuracy_score(y, pipeline.predict(X))\n\
          \    auc = roc_auc_score(y, pipeline.predict_proba(X)[:, 1])\n    print(f\"\
          Accuracy: {acc:.4f} | ROC AUC: {auc:.4f}\")\n\n    with open(f\"{DATA}/evaluation.json\"\
          , \"w\") as f:\n        json.dump({\"accuracy\": acc, \"roc_auc\": auc},\
          \ f, indent=2)\n\n"
        image: python:3.11-slim
    exec-feature-engineering:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - feature_engineering
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas==2.2.3'\
          \ 'numpy==2.2.3'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.16.1' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef feature_engineering():\n    import numpy as np\n    import pandas\
          \ as pd\n    from pathlib import Path\n\n    def _streak(history):\n   \
          \     if not history:\n            return 0\n        val = history[-1]\n\
          \        streak = 0\n        for r in reversed(history):\n            if\
          \ r == val: streak += 1\n            else: break\n        return streak\
          \ if val == 1 else -streak\n\n    def build_state(df):\n        state =\
          \ {\"elo\": {}, \"matches_played\": {}, \"win_history\": {}, \"h2h\": {},\
          \ \"map_history\": {}}\n        for team in pd.concat([df[\"team_1\"], df[\"\
          team_2\"]]).unique():\n            state[\"elo\"][team] = 1500\n       \
          \     state[\"matches_played\"][team] = 0\n            state[\"win_history\"\
          ][team] = []\n            state[\"map_history\"][team] = {}\n        return\
          \ state\n\n    def compute_features(match, state):\n        team, opp, map_name\
          \ = match[\"team_1\"], match[\"team_2\"], match[\"_map\"]\n        th =\
          \ state[\"win_history\"].get(team, [])\n        oh = state[\"win_history\"\
          ].get(opp, [])\n        h2h = state[\"h2h\"].get((team, opp), [])\n    \
          \    mht = state[\"map_history\"].get(team, {}).get(map_name, [])\n    \
          \    mho = state[\"map_history\"].get(opp, {}).get(map_name, [])\n     \
          \   return {\n            \"elo_diff\":        state[\"elo\"].get(team,\
          \ 1500) - state[\"elo\"].get(opp, 1500),\n            \"winrate_10_diff\"\
          : (np.mean(th[-10:]) if th else 0) - (np.mean(oh[-10:]) if oh else 0),\n\
          \            \"winrate_30_diff\": (np.mean(th[-30:]) if th else 0) - (np.mean(oh[-30:])\
          \ if oh else 0),\n            \"experience_diff\": state[\"matches_played\"\
          ].get(team, 0) - state[\"matches_played\"].get(opp, 0),\n            \"\
          rank_diff\":       match[\"rank_1\"] - match[\"rank_2\"],\n            \"\
          h2h_winrate\":     np.mean(h2h) if h2h else 0.5,\n            \"streak_diff\"\
          :     _streak(th) - _streak(oh),\n            \"map_winrate_diff\": (np.mean(mht)\
          \ if mht else 0.5) - (np.mean(mho) if mho else 0.5),\n        }\n\n    def\
          \ update_state(match, state, k=32):\n        team, opp, map_name = match[\"\
          team_1\"], match[\"team_2\"], match[\"_map\"]\n        result = int(match[\"\
          match_winner\"] == 1)\n        r_t, r_o = state[\"elo\"].get(team, 1500),\
          \ state[\"elo\"].get(opp, 1500)\n        exp = 1 / (1 + 10 ** ((r_o - r_t)\
          \ / 400))\n        state[\"elo\"][team] = r_t + k * (result - exp)\n   \
          \     state[\"elo\"][opp]  = r_o + k * ((1 - result) - (1 - exp))\n    \
          \    state[\"win_history\"].setdefault(team, []).append(result)\n      \
          \  state[\"win_history\"].setdefault(opp,  []).append(1 - result)\n    \
          \    state[\"matches_played\"][team] = state[\"matches_played\"].get(team,\
          \ 0) + 1\n        state[\"matches_played\"][opp]  = state[\"matches_played\"\
          ].get(opp,  0) + 1\n        state[\"h2h\"].setdefault((team, opp), []).append(result)\n\
          \        state[\"map_history\"].setdefault(team, {}).setdefault(map_name,\
          \ []).append(result)\n        state[\"map_history\"].setdefault(opp,  {}).setdefault(map_name,\
          \ []).append(1 - result)\n        return state\n\n    import urllib.request\n\
          \    url = \"https://raw.githubusercontent.com/Nayrode/MLOps/main/data/results.csv\"\
          \n    urllib.request.urlretrieve(url, f\"{DATA}/results.csv\")\n\n    df\
          \ = pd.read_csv(f\"{DATA}/results.csv\", index_col=0, parse_dates=[\"date\"\
          ])\n    print(f\"Loaded {len(df)} rows\")\n    state = build_state(df)\n\
          \    X, y = [], []\n    for _, match in df.iterrows():\n        X.append(compute_features(match,\
          \ state))\n        y.append(int(match[\"match_winner\"] == 1))\n       \
          \ state = update_state(match, state)\n    out = pd.concat([df, pd.DataFrame(X),\
          \ pd.Series(y, name=\"team_1_wins\")], axis=1)\n    out.to_csv(f\"{DATA}/df_featured.csv\"\
          )\n    print(f\"Saved {len(out)} rows \u2192 {DATA}/df_featured.csv\")\n\
          \n"
        image: python:3.11-slim
    exec-preprocessing:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - preprocessing
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas==2.2.3'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef preprocessing(train_ratio: float = 0.8):\n    import pandas as\
          \ pd\n\n    FEATURE_COLS = [\"elo_diff\", \"winrate_10_diff\", \"winrate_30_diff\"\
          ,\n                    \"experience_diff\", \"rank_diff\", \"h2h_winrate\"\
          ,\n                    \"streak_diff\", \"map_winrate_diff\", \"_map\"]\n\
          \n    df = pd.read_csv(f\"{DATA}/df_featured.csv\", index_col=0, parse_dates=[\"\
          date\"])\n    df = df.sort_values(\"date\").reset_index(drop=True)\n   \
          \ split = int(len(df) * train_ratio)\n    train_df, test_df = df.iloc[:split],\
          \ df.iloc[split:]\n\n    train_df[FEATURE_COLS].to_csv(f\"{DATA}/X_train.csv\"\
          )\n    train_df[\"team_1_wins\"].to_csv(f\"{DATA}/y_train.csv\")\n    test_df[FEATURE_COLS].to_csv(f\"\
          {DATA}/X_test.csv\")\n    test_df[\"team_1_wins\"].to_csv(f\"{DATA}/y_test.csv\"\
          )\n    print(f\"Train: {len(train_df)} | Test: {len(test_df)}\")\n\n"
        image: python:3.11-slim
    exec-train:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - train
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas==2.2.3'\
          \ 'scikit-learn==1.6.1' 'xgboost==3.2.0' 'joblib==1.5.0'  &&  python3 -m\
          \ pip install --quiet --no-warn-script-location 'kfp==2.16.1' '--no-deps'\
          \ 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"$0\" \"$@\"\
          \n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef train(model_type: str = \"xgboost\"):\n    import joblib\n  \
          \  import pandas as pd\n    from sklearn.compose import ColumnTransformer\n\
          \    from sklearn.pipeline import Pipeline\n    from sklearn.preprocessing\
          \ import OneHotEncoder, StandardScaler\n    from xgboost import XGBClassifier\n\
          \n    NUMERIC_COLS = [\"elo_diff\", \"winrate_10_diff\", \"winrate_30_diff\"\
          ,\n                    \"experience_diff\", \"rank_diff\", \"h2h_winrate\"\
          ,\n                    \"streak_diff\", \"map_winrate_diff\"]\n\n    X =\
          \ pd.read_csv(f\"{DATA}/X_train.csv\", index_col=0)\n    y = pd.read_csv(f\"\
          {DATA}/y_train.csv\", index_col=0).squeeze()\n\n    pipeline = Pipeline([\n\
          \        (\"preprocessor\", ColumnTransformer([\n            (\"scaler\"\
          ,  StandardScaler(), NUMERIC_COLS),\n            (\"encoder\", OneHotEncoder(handle_unknown=\"\
          ignore\", sparse_output=False), [\"_map\"]),\n        ])),\n        (\"\
          classifier\", XGBClassifier(\n            n_estimators=300, learning_rate=0.05,\n\
          \            max_depth=6, eval_metric=\"logloss\", random_state=42,\n  \
          \      )),\n    ])\n    pipeline.fit(X, y)\n    print(f\"Train accuracy:\
          \ {pipeline.score(X, y):.4f}\")\n    joblib.dump(pipeline, f\"{DATA}/model.pkl\"\
          )\n    print(f\"Saved model \u2192 {DATA}/model.pkl\")\n\n"
        image: python:3.11-slim
pipelineInfo:
  name: csgo-match-predictor
root:
  dag:
    tasks:
      evaluate:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-evaluate
        dependentTasks:
        - train
        taskInfo:
          name: evaluate
      feature-engineering:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-feature-engineering
        taskInfo:
          name: feature-engineering
      preprocessing:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-preprocessing
        dependentTasks:
        - feature-engineering
        inputs:
          parameters:
            train_ratio:
              componentInputParameter: train_ratio
        taskInfo:
          name: preprocessing
      train:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-train
        dependentTasks:
        - preprocessing
        inputs:
          parameters:
            model_type:
              componentInputParameter: model_type
        taskInfo:
          name: train
  inputDefinitions:
    parameters:
      model_type:
        defaultValue: xgboost
        isOptional: true
        parameterType: STRING
      train_ratio:
        defaultValue: 0.8
        isOptional: true
        parameterType: NUMBER_DOUBLE
schemaVersion: 2.1.0
sdkVersion: kfp-2.16.1
---
platforms:
  kubernetes:
    deploymentSpec:
      executors:
        exec-evaluate:
          pvcMount:
          - constant: csgo-data-pvc
            mountPath: /data
            pvcNameParameter:
              runtimeValue:
                constant: csgo-data-pvc
        exec-feature-engineering:
          pvcMount:
          - constant: csgo-data-pvc
            mountPath: /data
            pvcNameParameter:
              runtimeValue:
                constant: csgo-data-pvc
        exec-preprocessing:
          pvcMount:
          - constant: csgo-data-pvc
            mountPath: /data
            pvcNameParameter:
              runtimeValue:
                constant: csgo-data-pvc
        exec-train:
          pvcMount:
          - constant: csgo-data-pvc
            mountPath: /data
            pvcNameParameter:
              runtimeValue:
                constant: csgo-data-pvc
