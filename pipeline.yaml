          \ y_uri = y_train.uri.replace(\"minio://\", \"s3://\")\n\n    ts       \
          \ = int(time.time())\n    model_key = f\"csgo/models/{ts}/model.pkl\"\n\
          \    job_name  = f\"csgo-train-{ts}\"\n\n    training_script = \"\"\"\\\n\
          import subprocess, sys\nsubprocess.check_call([sys.executable, \"-m\", \"\
