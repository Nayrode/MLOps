          .pkl\", delete=False) as f:\n    joblib.dump(pipeline, f.name)\n    s3.upload_file(f.name,\
          \ os.environ[\"S3_BUCKET\"], os.environ[\"MODEL_KEY\"])\nprint(f\"Model\
          \ saved \u2192 s3://{os.environ['S3_BUCKET']}/{os.environ['MODEL_KEY']}\"\
          )\n\"\"\"\n\n    k8s_config.load_incluster_config()\n    custom_api = k8s.CustomObjectsApi()\n\
          \n    gpu_patch = {\n        \"manager\": \"pipeline-train-component\",\n\
          \        \"trainingRuntimeSpec\": {\n            \"template\": {\n     \
          \           \"spec\": {\n                    \"replicatedJobs\": [{\n  \
          \                      \"name\": \"node\",\n                        \"template\"\
          : {\n                            \"spec\": {\n                         \
          \       \"template\": {\n                                    \"spec\": {\n\
