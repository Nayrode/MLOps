# PIPELINE DEFINITION
# Name: csgo-match-predictor
# Inputs:
#    accuracy_threshold: float [Default: 0.6]
#    deploy_namespace: str [Default: 'csgo']
#    drift_threshold: float [Default: 0.2]
#    mlflow_tracking_uri: str [Default: 'http://mlflow.kubeflow.svc.cluster.local:5000']
#    model_registry_url: str [Default: 'http://model-registry-service.csgo.svc.cluster.local:8080']
#    model_type: str [Default: 'xgboost']
#    n_samples: int [Default: 10.0]
#    train_ratio: float [Default: 0.8]
components:
  comp-deploy:
    executorLabel: exec-deploy
    inputDefinitions:
      artifacts:
        model_uri:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
      parameters:
        namespace:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        inference_url:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-dvc-pull:
    executorLabel: exec-dvc-pull
    outputDefinitions:
      artifacts:
        raw_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-evaluate:
    executorLabel: exec-evaluate
    inputDefinitions:
      artifacts:
        X_test:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        y_test:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
    outputDefinitions:
      artifacts:
        eval_results:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
        metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
  comp-feature-engineering:
    executorLabel: exec-feature-engineering
    inputDefinitions:
      artifacts:
        raw_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
    outputDefinitions:
      artifacts:
        featured_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-monitoring:
    executorLabel: exec-monitoring
    inputDefinitions:
      artifacts:
        X_test:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        X_train:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        y_test:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        drift_threshold:
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      artifacts:
        drift_report:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
        monitoring_metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
  comp-preprocessing:
    executorLabel: exec-preprocessing
    inputDefinitions:
      artifacts:
        featured_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        train_ratio:
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      artifacts:
        X_test:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        X_train:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        y_test:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        y_train:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-test-inference:
    executorLabel: exec-test-inference
    inputDefinitions:
      artifacts:
        X_test:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        inference_url:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
        y_test:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        n_samples:
          defaultValue: 10.0
          isOptional: true
          parameterType: NUMBER_INTEGER
  comp-train:
    executorLabel: exec-train
    inputDefinitions:
      artifacts:
        X_train:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        y_train:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        model_type:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
  comp-upload-model:
    executorLabel: exec-upload-model
    inputDefinitions:
      artifacts:
        eval_results:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        accuracy_threshold:
          parameterType: NUMBER_DOUBLE
        mlflow_tracking_uri:
          parameterType: STRING
        model_registry_url:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        model_uri:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-deploy:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - deploy
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kubernetes==32.0.0'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef deploy(\n    model_uri: Input[Artifact],\n    namespace: str,\n\
          \    inference_url: Output[Artifact],\n):\n    import time\n    from kubernetes\
          \ import client as k8s_client, config as k8s_config\n    MODEL_NAME = \"\
          csgo-match-predictor\"\n\n    with open(model_uri.path) as f:\n        uri\
          \ = f.read().strip()\n\n    k8s_config.load_incluster_config()\n    custom_api\
          \ = k8s_client.CustomObjectsApi()\n\n    body = {\n        \"apiVersion\"\
          : \"serving.kserve.io/v1beta1\",\n        \"kind\": \"InferenceService\"\
          ,\n        \"metadata\": {\"name\": MODEL_NAME, \"namespace\": namespace},\n\
          \        \"spec\": {\n            \"predictor\": {\n                \"sklearn\"\
          : {\n                    \"storageUri\": uri,\n                    \"protocolVersion\"\
          : \"v2\",\n                }\n            }\n        },\n    }\n\n    try:\n\
          \        custom_api.create_namespaced_custom_object(\n            group=\"\
          serving.kserve.io\", version=\"v1beta1\",\n            namespace=namespace,\
          \ plural=\"inferenceservices\", body=body,\n        )\n        print(f\"\
          Created InferenceService {MODEL_NAME}\")\n    except k8s_client.exceptions.ApiException\
          \ as e:\n        if e.status == 409:\n            custom_api.replace_namespaced_custom_object(\n\
          \                group=\"serving.kserve.io\", version=\"v1beta1\",\n   \
          \             namespace=namespace, plural=\"inferenceservices\",\n     \
          \           name=MODEL_NAME, body=body,\n            )\n            print(f\"\
          Updated InferenceService {MODEL_NAME}\")\n        else:\n            raise\n\
          \n    for _ in range(60):\n        isvc = custom_api.get_namespaced_custom_object(\n\
          \            group=\"serving.kserve.io\", version=\"v1beta1\",\n       \
          \     namespace=namespace, plural=\"inferenceservices\", name=MODEL_NAME,\n\
          \        )\n        conditions = isvc.get(\"status\", {}).get(\"conditions\"\
          , [])\n        if any(c.get(\"type\") == \"Ready\" and c.get(\"status\"\
          ) == \"True\" for c in conditions):\n            url = isvc[\"status\"][\"\
          url\"]\n            print(f\"InferenceService ready at {url}\")\n      \
          \      with open(inference_url.path, \"w\") as f:\n                f.write(url)\n\
          \            return\n        time.sleep(5)\n    raise TimeoutError(f\"InferenceService\
          \ {MODEL_NAME} not ready after 300s\")\n\n"
        image: python:3.11-slim
    exec-dvc-pull:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - dvc_pull
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas==2.2.3'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef dvc_pull(raw_data: Output[Dataset]):\n    import urllib.request\n\
          \    import pandas as pd\n\n    REPO = \"https://raw.githubusercontent.com/Nayrode/MLOps/main\"\
          \n    urllib.request.urlretrieve(f\"{REPO}/data/results.csv\", raw_data.path)\n\
          \    df = pd.read_csv(raw_data.path)\n    print(f\"Downloaded {len(df)}\
          \ rows \u2192 {raw_data.path}\")\n\n"
        image: python:3.11-slim
    exec-evaluate:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - evaluate
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas==2.2.3'\
          \ 'scikit-learn==1.6.1' 'xgboost==3.2.0' 'joblib==1.5.0'  &&  python3 -m\
          \ pip install --quiet --no-warn-script-location 'kfp==2.16.1' '--no-deps'\
          \ 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"$0\" \"$@\"\
          \n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef evaluate(\n    model: Input[Model],\n    X_test: Input[Dataset],\n\
          \    y_test: Input[Dataset],\n    metrics: Output[Metrics],\n    eval_results:\
          \ Output[Artifact],\n):\n    import json\n    import joblib\n    import\
          \ pandas as pd\n    from sklearn.metrics import accuracy_score, roc_auc_score\n\
          \n    pipeline = joblib.load(model.path)\n    X = pd.read_csv(X_test.path,\
          \ index_col=0)\n    y = pd.read_csv(y_test.path, index_col=0).squeeze()\n\
          \n    acc = accuracy_score(y, pipeline.predict(X))\n    auc = roc_auc_score(y,\
          \ pipeline.predict_proba(X)[:, 1])\n    print(f\"Accuracy: {acc:.4f} | ROC\
          \ AUC: {auc:.4f}\")\n\n    metrics.log_metric(\"accuracy\", acc)\n    metrics.log_metric(\"\
          roc_auc\",  auc)\n\n    with open(eval_results.path, \"w\") as f:\n    \
          \    json.dump({\"accuracy\": acc, \"roc_auc\": auc}, f, indent=2)\n\n"
        image: python:3.11-slim
    exec-feature-engineering:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - feature_engineering
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas==2.2.3'\
          \ 'numpy==2.2.3'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.16.1' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef feature_engineering(\n    raw_data: Input[Dataset],\n    featured_data:\
          \ Output[Dataset],\n):\n    import numpy as np\n    import pandas as pd\n\
          \n    def _streak(history):\n        if not history:\n            return\
          \ 0\n        val = history[-1]\n        streak = 0\n        for r in reversed(history):\n\
          \            if r == val: streak += 1\n            else: break\n       \
          \ return streak if val == 1 else -streak\n\n    def build_state(df):\n \
          \       state = {\"elo\": {}, \"matches_played\": {}, \"win_history\": {},\
          \ \"h2h\": {}, \"map_history\": {}}\n        for team in pd.concat([df[\"\
          team_1\"], df[\"team_2\"]]).unique():\n            state[\"elo\"][team]\
          \ = 1500\n            state[\"matches_played\"][team] = 0\n            state[\"\
          win_history\"][team] = []\n            state[\"map_history\"][team] = {}\n\
          \        return state\n\n    def compute_features(match, state):\n     \
          \   team, opp, map_name = match[\"team_1\"], match[\"team_2\"], match[\"\
          _map\"]\n        th  = state[\"win_history\"].get(team, [])\n        oh\
          \  = state[\"win_history\"].get(opp, [])\n        h2h = state[\"h2h\"].get((team,\
          \ opp), [])\n        mht = state[\"map_history\"].get(team, {}).get(map_name,\
          \ [])\n        mho = state[\"map_history\"].get(opp,  {}).get(map_name,\
          \ [])\n        return {\n            \"elo_diff\":         state[\"elo\"\
          ].get(team, 1500) - state[\"elo\"].get(opp, 1500),\n            \"winrate_10_diff\"\
          :  (np.mean(th[-10:]) if th else 0) - (np.mean(oh[-10:]) if oh else 0),\n\
          \            \"winrate_30_diff\":  (np.mean(th[-30:]) if th else 0) - (np.mean(oh[-30:])\
          \ if oh else 0),\n            \"experience_diff\":  state[\"matches_played\"\
          ].get(team, 0) - state[\"matches_played\"].get(opp, 0),\n            \"\
          rank_diff\":        match[\"rank_1\"] - match[\"rank_2\"],\n           \
          \ \"h2h_winrate\":      np.mean(h2h) if h2h else 0.5,\n            \"streak_diff\"\
          :      _streak(th) - _streak(oh),\n            \"map_winrate_diff\": (np.mean(mht)\
          \ if mht else 0.5) - (np.mean(mho) if mho else 0.5),\n        }\n\n    def\
          \ update_state(match, state, k=32):\n        team, opp, map_name = match[\"\
          team_1\"], match[\"team_2\"], match[\"_map\"]\n        result = int(match[\"\
          match_winner\"] == 1)\n        r_t, r_o = state[\"elo\"].get(team, 1500),\
          \ state[\"elo\"].get(opp, 1500)\n        exp = 1 / (1 + 10 ** ((r_o - r_t)\
          \ / 400))\n        state[\"elo\"][team] = r_t + k * (result - exp)\n   \
          \     state[\"elo\"][opp]  = r_o + k * ((1 - result) - (1 - exp))\n    \
          \    state[\"win_history\"].setdefault(team, []).append(result)\n      \
          \  state[\"win_history\"].setdefault(opp,  []).append(1 - result)\n    \
          \    state[\"matches_played\"][team] = state[\"matches_played\"].get(team,\
          \ 0) + 1\n        state[\"matches_played\"][opp]  = state[\"matches_played\"\
          ].get(opp,  0) + 1\n        state[\"h2h\"].setdefault((team, opp), []).append(result)\n\
          \        state[\"map_history\"].setdefault(team, {}).setdefault(map_name,\
          \ []).append(result)\n        state[\"map_history\"].setdefault(opp,  {}).setdefault(map_name,\
          \ []).append(1 - result)\n        return state\n\n    df = pd.read_csv(raw_data.path,\
          \ index_col=0, parse_dates=[\"date\"])\n    print(f\"Loaded {len(df)} rows\"\
          )\n    state = build_state(df)\n    X, y = [], []\n    for _, match in df.iterrows():\n\
          \        X.append(compute_features(match, state))\n        y.append(int(match[\"\
          match_winner\"] == 1))\n        state = update_state(match, state)\n   \
          \ out = pd.concat([df, pd.DataFrame(X), pd.Series(y, name=\"team_1_wins\"\
          )], axis=1)\n    out.to_csv(featured_data.path)\n    print(f\"Saved {len(out)}\
          \ rows \u2192 {featured_data.path}\")\n\n"
        image: python:3.11-slim
    exec-monitoring:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - monitoring
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas==2.2.3'\
          \ 'scikit-learn==1.6.1' 'xgboost==3.2.0' 'joblib==1.5.0' 'evidently==0.7.21'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef monitoring(\n    X_train: Input[Dataset],\n    X_test: Input[Dataset],\n\
          \    y_test: Input[Dataset],\n    model: Input[Model],\n    drift_threshold:\
          \ float,\n    drift_report: Output[Artifact],\n    monitoring_metrics: Output[Metrics],\n\
          ):\n    import joblib\n    import pandas as pd\n    from sklearn.metrics\
          \ import accuracy_score, roc_auc_score\n    from evidently import Report\n\
          \    from evidently.presets import DataDriftPreset\n\n    reference = pd.read_csv(X_train.path,\
          \ index_col=0)\n    current   = pd.read_csv(X_test.path,  index_col=0)\n\
          \    y         = pd.read_csv(y_test.path,  index_col=0).squeeze()\n\n  \
          \  snapshot = Report([DataDriftPreset()]).run(reference_data=reference,\
          \ current_data=current)\n    snapshot.save_html(drift_report.path)\n\n \
          \   metrics_data  = snapshot.dict()[\"metrics\"]\n    drift_result  = metrics_data[0][\"\
          value\"]\n    share_drifted = drift_result[\"share\"]\n    n_drifted   \
          \  = int(drift_result[\"count\"])\n    n_total       = len(reference.columns)\n\
          \n    print(f\"Drifted columns: {n_drifted}/{n_total} ({share_drifted:.1%})\"\
          )\n    if share_drifted > drift_threshold:\n        print(f\"ALERT: drift\
          \ {share_drifted:.1%} exceeds threshold {drift_threshold:.1%}\")\n    else:\n\
          \        print(\"No significant drift detected.\")\n\n    pipeline = joblib.load(model.path)\n\
          \    y_pred = pipeline.predict(current)\n    y_prob = pipeline.predict_proba(current)[:,\
          \ 1]\n    acc    = accuracy_score(y, y_pred)\n    auc    = roc_auc_score(y,\
          \ y_prob)\n    print(f\"Accuracy: {acc:.4f} | ROC AUC: {auc:.4f}\")\n\n\
          \    monitoring_metrics.log_metric(\"share_drifted\",      share_drifted)\n\
          \    monitoring_metrics.log_metric(\"n_drifted_columns\",  float(n_drifted))\n\
          \    monitoring_metrics.log_metric(\"accuracy\",           acc)\n    monitoring_metrics.log_metric(\"\
          roc_auc\",            auc)\n\n"
        image: python:3.11-slim
    exec-preprocessing:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - preprocessing
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas==2.2.3'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef preprocessing(\n    featured_data: Input[Dataset],\n    train_ratio:\
          \ float,\n    X_train: Output[Dataset],\n    y_train: Output[Dataset],\n\
          \    X_test: Output[Dataset],\n    y_test: Output[Dataset],\n):\n    import\
          \ pandas as pd\n\n    FEATURE_COLS = [\"elo_diff\", \"winrate_10_diff\"\
          , \"winrate_30_diff\",\n                    \"experience_diff\", \"rank_diff\"\
          , \"h2h_winrate\",\n                    \"streak_diff\", \"map_winrate_diff\"\
          , \"_map\"]\n\n    df = pd.read_csv(featured_data.path, index_col=0, parse_dates=[\"\
          date\"])\n    df = df.sort_values(\"date\").reset_index(drop=True)\n   \
          \ split = int(len(df) * train_ratio)\n    train_df, test_df = df.iloc[:split],\
          \ df.iloc[split:]\n\n    train_df[FEATURE_COLS].to_csv(X_train.path)\n \
          \   train_df[\"team_1_wins\"].to_csv(y_train.path)\n    test_df[FEATURE_COLS].to_csv(X_test.path)\n\
          \    test_df[\"team_1_wins\"].to_csv(y_test.path)\n    print(f\"Train: {len(train_df)}\
          \ | Test: {len(test_df)}\")\n\n"
        image: python:3.11-slim
    exec-test-inference:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - test_inference
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'requests==2.32.3'\
          \ 'pandas==2.2.3'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.16.1' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef test_inference(\n    inference_url: Input[Artifact],\n    X_test:\
          \ Input[Dataset],\n    y_test: Input[Dataset],\n    n_samples: int = 10,\n\
          ):\n    import requests\n    import pandas as pd\n    MODEL_NAME = \"csgo-match-predictor\"\
          \n\n    with open(inference_url.path) as f:\n        base_url = f.read().strip()\n\
          \n    X = pd.read_csv(X_test.path, index_col=0)\n    y = pd.read_csv(y_test.path,\
          \ index_col=0).squeeze()\n\n    sample   = X.sample(n_samples, random_state=42)\n\
          \    expected = y.loc[sample.index].tolist()\n\n    url      = f\"{base_url}/v1/models/{MODEL_NAME}:predict\"\
          \n    response = requests.post(url, json={\"instances\": sample.values.tolist()},\
          \ timeout=30)\n    response.raise_for_status()\n\n    predictions = response.json()[\"\
          predictions\"]\n    correct = sum(p == e for p, e in zip(predictions, expected))\n\
          \    print(f\"Smoke test: {correct}/{n_samples} correct\")\n    assert len(predictions)\
          \ == n_samples, f\"Expected {n_samples}, got {len(predictions)}\"\n    assert\
          \ all(p in [0, 1] for p in predictions), \"Predictions must be 0 or 1\"\n\
          \    print(\"Smoke test passed.\")\n\n"
        image: python:3.11-slim
    exec-train:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - train
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas==2.2.3'\
          \ 'scikit-learn==1.6.1' 'xgboost==3.2.0' 'joblib==1.5.0'  &&  python3 -m\
          \ pip install --quiet --no-warn-script-location 'kfp==2.16.1' '--no-deps'\
          \ 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"$0\" \"$@\"\
          \n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef train(\n    X_train: Input[Dataset],\n    y_train: Input[Dataset],\n\
          \    model_type: str,\n    model: Output[Model],\n):\n    import joblib\n\
          \    import pandas as pd\n    from sklearn.compose import ColumnTransformer\n\
          \    from sklearn.pipeline import Pipeline\n    from sklearn.preprocessing\
          \ import OneHotEncoder, StandardScaler\n    from xgboost import XGBClassifier\n\
          \n    NUMERIC_COLS = [\"elo_diff\", \"winrate_10_diff\", \"winrate_30_diff\"\
          ,\n                    \"experience_diff\", \"rank_diff\", \"h2h_winrate\"\
          ,\n                    \"streak_diff\", \"map_winrate_diff\"]\n\n    X =\
          \ pd.read_csv(X_train.path, index_col=0)\n    y = pd.read_csv(y_train.path,\
          \ index_col=0).squeeze()\n\n    pipeline = Pipeline([\n        (\"preprocessor\"\
          , ColumnTransformer([\n            (\"scaler\",  StandardScaler(), NUMERIC_COLS),\n\
          \            (\"encoder\", OneHotEncoder(handle_unknown=\"ignore\", sparse_output=False),\
          \ [\"_map\"]),\n        ])),\n        (\"classifier\", XGBClassifier(\n\
          \            n_estimators=300, learning_rate=0.05,\n            max_depth=6,\
          \ eval_metric=\"logloss\", random_state=42,\n        )),\n    ])\n    pipeline.fit(X,\
          \ y)\n    print(f\"Train accuracy: {pipeline.score(X, y):.4f}\")\n    joblib.dump(pipeline,\
          \ model.path)\n    print(f\"Saved model \u2192 {model.path}\")\n\n"
        image: python:3.11-slim
    exec-upload-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - upload_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'mlflow==2.19.0'\
          \ 'scikit-learn==1.6.1' 'xgboost==3.2.0' 'joblib==1.5.0' 'boto3==1.36.0'\
          \ 'requests==2.32.3'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.16.1' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef upload_model(\n    model: Input[Model],\n    eval_results: Input[Artifact],\n\
          \    accuracy_threshold: float,\n    mlflow_tracking_uri: str,\n    model_registry_url:\
          \ str,\n    model_uri: Output[Artifact],\n):\n    import json\n    import\
          \ joblib\n    import mlflow\n    import mlflow.sklearn\n    import requests\
          \ as http\n\n    MODEL_NAME = \"csgo-match-predictor\"\n    MR_API = f\"\
          {model_registry_url}/api/model_registry/v1alpha3\"\n\n    pipeline = joblib.load(model.path)\n\
          \    with open(eval_results.path) as f:\n        metrics_data = json.load(f)\n\
          \n    print(f\"Accuracy: {metrics_data['accuracy']:.4f} | AUC: {metrics_data['roc_auc']:.4f}\"\
          )\n    if metrics_data[\"accuracy\"] < accuracy_threshold:\n        raise\
          \ ValueError(f\"Accuracy {metrics_data['accuracy']:.4f} below threshold\
          \ {accuracy_threshold}\")\n\n    # Store artifact via MLflow, retrieve actual\
          \ S3 URI\n    mlflow.set_tracking_uri(mlflow_tracking_uri)\n    mlflow.set_experiment(MODEL_NAME)\n\
          \    with mlflow.start_run(run_name=\"kubeflow-pipeline\") as run:\n   \
          \     mlflow.log_metrics(metrics_data)\n        mlflow.log_params({\"model_type\"\
          : type(pipeline.named_steps[\"classifier\"]).__name__})\n        mlflow.sklearn.log_model(pipeline,\
          \ artifact_path=\"model\")\n        artifact_uri = mlflow.get_artifact_uri(\"\
          model\")\n\n    version_name = run.info.run_id[:8]\n\n    # Create or retrieve\
          \ RegisteredModel\n    resp = http.post(\n        f\"{MR_API}/registered_models\"\
          ,\n        json={\"name\": MODEL_NAME, \"description\": \"CS:GO match predictor\"\
          },\n        timeout=30,\n    )\n    if resp.status_code == 409:\n      \
          \  resp = http.get(f\"{MR_API}/registered_models\", timeout=30)\n      \
          \  resp.raise_for_status()\n        rm_id = next(rm[\"id\"] for rm in resp.json()[\"\
          items\"] if rm[\"name\"] == MODEL_NAME)\n    else:\n        resp.raise_for_status()\n\
          \        rm_id = resp.json()[\"id\"]\n\n    # Create ModelVersion with evaluation\
          \ metrics as custom properties\n    mv_resp = http.post(\n        f\"{MR_API}/model_versions\"\
          ,\n        json={\n            \"name\": version_name,\n            \"registeredModelId\"\
          : rm_id,\n            \"customProperties\": {\n                \"accuracy\"\
          : {\"metadataType\": \"MetadataDoubleValue\", \"double_value\": metrics_data[\"\
          accuracy\"]},\n                \"roc_auc\":  {\"metadataType\": \"MetadataDoubleValue\"\
          , \"double_value\": metrics_data[\"roc_auc\"]},\n            },\n      \
          \  },\n        timeout=30,\n    )\n    mv_resp.raise_for_status()\n    mv_id\
          \ = mv_resp.json()[\"id\"]\n\n    # Link artifact URI to the model version\n\
          \    ma_resp = http.post(\n        f\"{MR_API}/model_versions/{mv_id}/artifacts\"\
          ,\n        json={\n            \"name\": f\"{MODEL_NAME}-{version_name}\"\
          ,\n            \"uri\": artifact_uri,\n            \"artifactType\": \"\
          model-artifact\",\n            \"state\": \"LIVE\",\n        },\n      \
          \  timeout=30,\n    )\n    ma_resp.raise_for_status()\n\n    print(f\"Registered\
          \ '{MODEL_NAME}' version '{version_name}' (id={mv_id}) \u2192 {artifact_uri}\"\
          )\n\n    with open(model_uri.path, \"w\") as f:\n        f.write(artifact_uri)\n\
          \n"
        image: python:3.11-slim
pipelineInfo:
  name: csgo-match-predictor
root:
  dag:
    tasks:
      deploy:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-deploy
        dependentTasks:
        - upload-model
        inputs:
          artifacts:
            model_uri:
              taskOutputArtifact:
                outputArtifactKey: model_uri
                producerTask: upload-model
          parameters:
            namespace:
              componentInputParameter: deploy_namespace
        taskInfo:
          name: deploy
      dvc-pull:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-dvc-pull
        taskInfo:
          name: dvc-pull
      evaluate:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-evaluate
        dependentTasks:
        - preprocessing
        - train
        inputs:
          artifacts:
            X_test:
              taskOutputArtifact:
                outputArtifactKey: X_test
                producerTask: preprocessing
            model:
              taskOutputArtifact:
                outputArtifactKey: model
                producerTask: train
            y_test:
              taskOutputArtifact:
                outputArtifactKey: y_test
                producerTask: preprocessing
        taskInfo:
          name: evaluate
      feature-engineering:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-feature-engineering
        dependentTasks:
        - dvc-pull
        inputs:
          artifacts:
            raw_data:
              taskOutputArtifact:
                outputArtifactKey: raw_data
                producerTask: dvc-pull
        taskInfo:
          name: feature-engineering
      monitoring:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-monitoring
        dependentTasks:
        - preprocessing
        - train
        inputs:
          artifacts:
            X_test:
              taskOutputArtifact:
                outputArtifactKey: X_test
                producerTask: preprocessing
            X_train:
              taskOutputArtifact:
                outputArtifactKey: X_train
                producerTask: preprocessing
            model:
              taskOutputArtifact:
                outputArtifactKey: model
                producerTask: train
            y_test:
              taskOutputArtifact:
                outputArtifactKey: y_test
                producerTask: preprocessing
          parameters:
            drift_threshold:
              componentInputParameter: drift_threshold
        taskInfo:
          name: monitoring
      preprocessing:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-preprocessing
        dependentTasks:
        - feature-engineering
        inputs:
          artifacts:
            featured_data:
              taskOutputArtifact:
                outputArtifactKey: featured_data
                producerTask: feature-engineering
          parameters:
            train_ratio:
              componentInputParameter: train_ratio
        taskInfo:
          name: preprocessing
      test-inference:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-test-inference
        dependentTasks:
        - deploy
        - preprocessing
        inputs:
          artifacts:
            X_test:
              taskOutputArtifact:
                outputArtifactKey: X_test
                producerTask: preprocessing
            inference_url:
              taskOutputArtifact:
                outputArtifactKey: inference_url
                producerTask: deploy
            y_test:
              taskOutputArtifact:
                outputArtifactKey: y_test
                producerTask: preprocessing
          parameters:
            n_samples:
              componentInputParameter: n_samples
        taskInfo:
          name: test-inference
      train:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-train
        dependentTasks:
        - preprocessing
        inputs:
          artifacts:
            X_train:
              taskOutputArtifact:
                outputArtifactKey: X_train
                producerTask: preprocessing
            y_train:
              taskOutputArtifact:
                outputArtifactKey: y_train
                producerTask: preprocessing
          parameters:
            model_type:
