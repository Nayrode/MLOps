name: DVC Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install DVC
        run: pip install dvc

      - name: Set up notebook kernels
        run: |
          cd 01_feature_engineering && uv sync && \
            .venv/bin/python -m ipykernel install --user \
            --name feature-engineering --display-name "Python (01_feature_engineering)"
          cd ../02_preprocessing && uv sync && \
            .venv/bin/python -m ipykernel install --user \
            --name preprocessing --display-name "Python (02_preprocessing)"
          cd ../03_train_model_kubernetes && uv sync

      - name: Run pipeline
        run: dvc repro

      - name: Commit updated outputs
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ dvc.lock
          git diff --staged --quiet || git commit -m "ci: update pipeline outputs [skip ci]"
          git push

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: data/model.pkl
